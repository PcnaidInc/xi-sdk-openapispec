name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenAPI Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON specification
        run: python3 -m json.tool openapispec/unified/XI-Resellers-API-Spec.json > /dev/null

      - name: Validate YAML specification
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML not available; skipping YAML parse check")
              sys.exit(0)
          with open("openapispec/unified/XI-Resellers-API-Spec.yaml", "r", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          print("YAML syntax OK")
          PY

      - name: Validate workflow and docs YAML syntax
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML not available; skipping workflow YAML parse check")
              sys.exit(0)
          with open(".github/workflows/ci.yml", "r", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          print("Workflow YAML syntax OK")
          PY